name: map demo

# Publishes the web/ folder (the pages, the built map libraries and the data files) to GitHub Pages.
# Manual only: hosting is planned elsewhere, and Pages needs a public repo on a free account.
# To use it: repository Settings > Pages > Source: GitHub Actions, then run this workflow by hand.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4

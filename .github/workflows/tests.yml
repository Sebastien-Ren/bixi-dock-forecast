name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      # Scoring checked by hand, station naming, the self-correcting band, and no-leakage tests.
      # None of them need the raw data.
      - run: python -m pytest -q
